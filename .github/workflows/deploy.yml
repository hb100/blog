# Bouwt de Astro-site en zet hem op GitHub Pages bij elke push naar master.
name: Site bouwen en publiceren

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Node.js installeren
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pakketten installeren
        run: npm ci

      - name: Site bouwen
        run: npm run build

      - name: GitHub Pages voorbereiden
        uses: actions/configure-pages@v6

      - name: Site uploaden
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
